# Materials Literature Agent — optimized defaults (readme_agent.md)
topic: "SnSe lattice thermal conductivity vacancy engineering"
subfield: "thermoelectrics"
max_papers: 20
year_from: 2018
open_access_only: false
ontology_path: "configs/ontologies/thermoelectrics.yaml"
seed: 42

retrieval:
  backend: openalex
  mailto: "${OPENALEX_EMAIL:team@example.com}"
  openalex_api_key: "${OPENALEX_API_KEY:}"
  min_cited_by: 0
  rewrite_queries: true
  multi_query: true
  fetch_multiplier: 3
  min_relevance: 0.12
  prefer_oa: true
  fetch_fulltext: true
  fulltext_cache_dir: "data/fulltext"

fulltext:
  download_oa: false
  max_pdf_mb: 25
  pdf_cache_dir: "data/fulltext/pdfs"
  parse_cache_dir: "data/fulltext/parsed"
  chunk_cache_dir: "data/fulltext/chunks"
  unpaywall:
    enabled: true
    email: "${UNPAYWALL_EMAIL:team@example.com}"
  parsers:
    primary: mineru
    secondary: grobid
    mineru_mode: cli
    mineru_cmd: mineru
    mineru_api_url: "${MINERU_API_URL:}"
    grobid_url: "${GROBID_BASE_URL:http://localhost:8070}"
  index:
    backend: file
    qdrant_url: "${QDRANT_URL:http://localhost:6333}"
    qdrant_api_key: "${QDRANT_API_KEY:}"
    collection: materials_evidence
    vector_size: 64

evidence_retrieval:
  enabled: true
  top_k: 5
  min_retrieval_score: 0.05

llm:
  enabled: true
  provider: "${LLM_PROVIDER:openai}"
  base_url: "${OPENAI_BASE_URL:https://api.openai.com/v1}"
  api_key: "${OPENAI_API_KEY:}"
  model: "${OPENAI_MODEL:gpt-4o-mini}"
  cursor_api_key: "${CURSOR_API_KEY:}"
  cursor_model: "${CURSOR_MODEL:composer-2.5}"
  cursor_workspace: "${CURSOR_WORKSPACE:.}"
  temperature: 0.2
  max_tokens: 4096
  max_retries: 2
  rewrite:
    temperature: 0.1
  extract:
    temperature: 0.0
  gap:
    # optionally set a stronger model: model: "gpt-4o"
    temperature: 0.2
  review:
    temperature: 0.1
  report:
    temperature: 0.3
  route_a:
    temperature: 0.5

quality:
  require_evidence: true
  min_quote_chars: 12
  min_evidence_confidence: 0.3
  require_next_step: true
  require_falsification: true
  drop_gaps_without_evidence: true
  min_gap_actionability: 0.35
  require_quote_substring: false
  require_fulltext_gap_evidence: false
  min_fulltext_paper_ratio: 0.0
  reject_evidence_without_provenance: false
  allow_abstract_fallback: true

pipeline:
  extract: true
  identify_gaps: true
  review_gaps: true
  build_known_table: true
  check_consistency: true
  write_report: true
  audit_log: true

route_a:
  enabled: false
  n_iterations: 8
  population_size: 6
  seed: 42
  min_plausibility: 0.25
  label_known_vs_new: true
  external_validate: true
  validate_top_k: 5
  materials_db: offline

materials_db:
  provider: offline
  mp_api_key: "${MP_API_KEY:}"
  cache_path: "data/materials_db_cache.json"

output_dir: "outputs"
cache_dir: "data/cache"
