[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "materials-agent"
version = "0.1.0"
description = "GOAI Track3 materials literature-driven scientific discovery agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
  "tenacity>=8.2",
]

[project.optional-dependencies]
llm = ["openai>=1.30"]
cursor-sdk = ["cursor-sdk"]
qdrant = ["qdrant-client>=1.12"]
scibase = ["datasets>=2.19", "pyarrow"]
dev = ["pytest>=8.0", "qdrant-client>=1.12", "datasets>=2.19", "pyarrow"]

[project.scripts]
materials-agent = "materials_agent.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["materials_agent*"]
